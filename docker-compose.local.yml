# FlashDeal on your LAPTOP, talking to the REAL AWS SQS queue (use it to test before deploying to EC2):
#   1. Learner Lab > "AWS Details" > copy the three credentials into .env (see .env.example), create the queues
#      (aws/setup-sqs.sh, or the SQS console), then:
#   2. docker compose -f docker-compose.local.yml up --build
# Lab credentials expire when the session ends: paste the new ones into .env and run `docker compose -f docker-compose.local.yml up -d` again.
# Nothing here is used on EC2 (docker-compose.yml is).

x-aws-env: &aws-env
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
  SQS_QUEUE_NAME: ${SQS_QUEUE_NAME:-flashdeal-claims}

services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - "27018:27017"   # MongoDB Compass: mongodb://localhost:27018
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  migrate:
    build: ./db
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - MONGO_DB=flashdeal
    depends_on:
      mongo: { condition: service_healthy }
    restart: "no"

  catalog-service:
    build: ./catalog-service
    restart: unless-stopped
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - MONGO_DB=flashdeal
    depends_on:
      mongo: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-gateway:
    build: ./api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      <<: *aws-env
      SERVICE_NAME: api-gateway
      REDIS_URL: redis://redis:6379
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: flashdeal
      CATALOG_SERVICE_URL: http://catalog-service:4000
      RATE_LIMIT_CAPACITY: ${RATE_LIMIT_CAPACITY:-10}
      RATE_LIMIT_REFILL_PER_SEC: ${RATE_LIMIT_REFILL_PER_SEC:-5}
      CACHE_TTL_SEC: 3
    depends_on:
      redis: { condition: service_healthy }
      mongo: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      catalog-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: ./worker
    restart: unless-stopped
    environment:
      <<: *aws-env
      SERVICE_NAME: worker
      REDIS_URL: redis://redis:6379
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: flashdeal
      WORKER_PREFETCH: 5
      PROCESSING_MS_MIN: ${PROCESSING_MS_MIN:-150}
      PROCESSING_MS_MAX: ${PROCESSING_MS_MAX:-400}
      FAIL_RATE: ${FAIL_RATE:-0}
    depends_on:
      redis: { condition: service_healthy }
      mongo: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/heartbeat) )) -lt 60"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s

  client:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - api-gateway

volumes:
  mongo-data:
