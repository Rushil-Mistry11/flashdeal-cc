server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;                                  # do not advertise the nginx version

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  location /api/ {
    proxy_pass http://api-gateway:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # OVERWRITE (not append) so a client cannot fake its IP and dodge the per-IP rate limiter.
    # nginx is the only proxy in front of the gateway on this deployment.
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location / {
    try_files $uri /index.html;
  }
}
